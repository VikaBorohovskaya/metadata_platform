[project]
name = "metadata-platform"
version = "0.1.0"
description = "Metadata quality and coverage proof of concept for Unity Catalog assets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.30",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
metadata-platform = "metadata_platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metadata_platform"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
